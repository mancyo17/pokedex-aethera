<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amanome Eleven</title>
<meta name="description" content="Fonda il club di calcio della scuola media di Amanome ed entra nel mondo di Inazuma Eleven. Gioco di ruolo calcistico offline.">
<meta name="theme-color" content="#0a1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --sfondo:#080d18; --sfondo2:#0e1730; --pannello:#131f3d; --pannello2:#1a2a50;
  --bordo:#27365f; --testo:#e8eefc; --tenue:#93a3c4; --fioco:#5f6f92;
  --accento:#ffd23f; --accento2:#ff8a3d; --verde:#3fd07a; --rosso:#ff5468;
  --blu:#4aa8ff; --viola:#a678ff;
  --amanome:#2f9e63; --amanome2:#0f5c39;
  --raggio:14px; --ombra:0 6px 22px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{background:#080d18;min-height:100%}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%, #16294f 0%, transparent 60%),
    linear-gradient(180deg,#0a1224 0%, #080d18 100%);
  background-attachment:fixed;
  color:var(--testo);
  font-family:"Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
#app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- due colonne, quando lo schermo le regge ---------- */
.due-colonne{display:grid;gap:14px}
.col-sx,.col-dx{min-width:0}

@media (min-width:900px){
  #app{max-width:1120px}
  #barra{min-height:58px;padding:9px 18px}
  #barra .tit{font-size:17px}
  #barra .tit small{font-size:12px}
  #schermo{padding:18px 18px 40px}
  .due-colonne{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start;gap:18px}
  .col-dx{position:sticky;top:74px}
  #campo{height:230px}
  .pedina{width:24px;height:24px;margin:-12px 0 0 -12px;font-size:11px}
  .pedina.palla{width:28px;height:28px;margin:-14px 0 0 -14px}
  #log{max-height:340px;font-size:15px}
  #chat{max-width:760px;margin:0 auto}
  .battuta .bolla{font-size:16px}
  .luogo{max-width:760px;margin-left:auto;margin-right:auto}
  #avanti{max-width:760px;margin:0 auto}
  .griglia-schede{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .griglia-schede .scheda{margin-bottom:0}
  .titolone{font-size:44px}
  .bt:hover{background:#26386a;border-color:#3a4f86}
  .bt.primario:hover,.bt.verde:hover{filter:brightness(1.08)}
  .scheda{transition:background .13s ease, border-color .13s ease}
  .scheda:hover{background:var(--pannello2);border-color:#3a4f86}
  .mini:hover{background:#26386a}
  .pastiglia:hover{transform:scale(1.12)}
}
@media (min-width:1250px){ #app{max-width:1220px} }

/* ---------- tasti: il numerino sui bottoni ---------- */
.tasto{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  font-size:11px;font-weight:bold;margin-right:8px;vertical-align:1px;flex:none;
  font-variant-numeric:tabular-nums}
.bt.primario .tasto,.bt.verde .tasto{background:rgba(0,0,0,.16);border-color:rgba(0,0,0,.24)}
body:not(.tastiera) .tasto{display:none}
.aiuto-tasti{font-size:12px;color:var(--fioco);text-align:center;margin:10px 0 0}
body:not(.tastiera) .aiuto-tasti{display:none}

/* ---------- barra ---------- */
#barra{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:8px 12px;background:rgba(10,16,32,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bordo);min-height:52px}
#barra.nascosta{display:none}
#barra .stemma{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--amanome),var(--amanome2));font-size:18px;flex:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
#barra .tit{font-weight:bold;letter-spacing:.3px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#barra .tit small{display:block;font-weight:normal;color:var(--tenue);font-size:11px;letter-spacing:0}
#barra .risorse{display:flex;gap:6px;flex:none}
.gettone{background:var(--pannello);border:1px solid var(--bordo);border-radius:999px;
  padding:3px 7px;font-size:11px;white-space:nowrap;color:var(--tenue)}
@media (max-width:420px){ #barra .tit{font-size:14px} #barra .tit small{font-size:10px} .gettone{padding:2px 6px} }
.gettone b{color:var(--testo)}

#schermo{flex:1;padding:12px 12px 24px}

/* ---------- generici ---------- */
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px}
p{margin:0 0 10px}
.tenue{color:var(--tenue)} .fioco{color:var(--fioco)} .picc{font-size:13px}
.centro{text-align:center}
.pannello{background:linear-gradient(180deg,var(--pannello) 0%, #101a35 100%);
  border:1px solid var(--bordo);border-radius:var(--raggio);padding:14px;margin:0 0 12px;
  box-shadow:var(--ombra), 0 1px 0 rgba(255,255,255,.05) inset}
.pannello.stretto{padding:10px}
.riga{display:flex;gap:8px;align-items:center}
.riga.tra{justify-content:space-between}
.griglia{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.g4{grid-template-columns:repeat(2,1fr)}}
hr{border:0;border-top:1px solid var(--bordo);margin:12px 0}

.etichetta{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--fioco);margin-bottom:4px}

/* ---------- bottoni ---------- */
button{font-family:inherit;font-size:15px;color:var(--testo);cursor:pointer}
.bt{display:block;width:100%;text-align:left;
  background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,0)) var(--pannello2);
  border:1px solid var(--bordo);border-radius:11px;padding:11px 13px;margin:0 0 8px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 8px rgba(0,0,0,.22);
  transition:transform .06s ease, background .15s ease, box-shadow .15s ease}
.bt:active{transform:scale(.985)}
.bt:hover{background:#233560}
.bt.primario{background:linear-gradient(135deg,var(--accento) 0%, var(--accento2) 100%);
  color:#20160a;border-color:#ffca2b;font-weight:bold;text-align:center;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 4px 14px rgba(255,150,40,.28)}
.bt.primario:hover{filter:brightness(1.07)}
.bt.verde{background:linear-gradient(135deg,#3fd07a,#1f9450);color:#052414;border-color:#3fd07a;font-weight:bold;text-align:center;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 4px 14px rgba(63,208,122,.25)}
.bt.rossa{background:#3a1622;border-color:#7a2338;color:#ffb9c4}
.bt.piatta{background:transparent;border-color:var(--bordo);text-align:center}
.bt.disab,.bt[disabled]{opacity:.4;pointer-events:none}
.bt small{display:block;color:var(--tenue);font-size:12px;font-weight:normal;margin-top:2px}
.bt.primario small,.bt.verde small{color:rgba(0,0,0,.55)}
.btfila{display:flex;gap:8px}
.btfila .bt{margin-bottom:0}
.mini{font-size:13px;padding:7px 10px;border-radius:9px;background:var(--pannello2);
  border:1px solid var(--bordo);width:auto;display:inline-block;margin:0}
.mini.on{background:var(--accento);color:#20160a;border-color:var(--accento);font-weight:bold}
.chip-riga{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pastiglia{width:26px;height:26px;border-radius:50%;border:2px solid var(--bordo);cursor:pointer;padding:0}
.pastiglia.on{border-color:var(--accento);box-shadow:0 0 0 2px rgba(255,210,63,.35)}

input[type=text]{width:100%;padding:11px 12px;border-radius:11px;
  background:#0b1327;border:1px solid var(--bordo);color:var(--testo);font-size:16px;font-family:inherit}
input[type=text]:focus{outline:2px solid var(--accento);outline-offset:1px}

/* ---------- ritratti ---------- */
.ritratto{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-weight:bold;font-size:15px;color:#0a0f1e;position:relative;overflow:visible;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset, 0 2px 8px rgba(0,0,0,.35)}
.ritratto:before{content:"";position:absolute;inset:-2px;border-radius:inherit;
  border:2px solid var(--anello, transparent);opacity:.85;pointer-events:none}
.ritratto.gr{width:64px;height:64px;font-size:22px;border-radius:16px}
.ritratto.pc{width:30px;height:30px;font-size:11px;border-radius:9px}
.ritratto .el{position:absolute;right:-4px;bottom:-4px;font-size:11px;background:var(--sfondo);
  border-radius:999px;width:17px;height:17px;display:grid;place-items:center;
  border:1px solid var(--bordo);z-index:2}
.ritratto .volto{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:inherit}
.ritratto.pc{width:40px;height:40px;border-radius:12px}
.ritratto.pc .el{width:15px;height:15px;font-size:9px;right:-3px;bottom:-3px}
.volto-grande{width:132px;height:132px;border-radius:26px;overflow:hidden;position:relative;
  background:linear-gradient(150deg,#2a3a60,#141d33);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;flex:none}
.volto-grande svg{width:100%;height:100%;display:block}

/* ---------- chat storia ---------- */
#chat{padding-bottom:86px}
.luogo{text-align:center;color:var(--fioco);font-size:12px;letter-spacing:1.5px;
  text-transform:uppercase;margin:14px 0 10px;position:relative}
.luogo:before,.luogo:after{content:"";position:absolute;top:50%;width:22%;height:1px;background:var(--bordo)}
.luogo:before{left:0}.luogo:after{right:0}
.battuta{display:flex;gap:9px;margin:0 0 11px;animation:entra .22s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.battuta .corpo{flex:1;min-width:0}
.battuta .chi{font-size:12px;color:var(--tenue);margin-bottom:2px;font-weight:bold}
.bolla{background:var(--pannello);border:1px solid var(--bordo);border-radius:4px 14px 14px 14px;
  padding:9px 12px}
.battuta.io{flex-direction:row-reverse}
.battuta.io .chi{text-align:right}
.battuta.io .bolla{background:#1e3a2c;border-color:#2f6b4c;border-radius:14px 4px 14px 14px}
.battuta.narr{display:block;margin:0 0 12px}
.battuta.narr .bolla{background:transparent;border:0;border-left:3px solid var(--bordo);
  border-radius:0;color:var(--tenue);font-style:italic;padding:2px 0 2px 12px}
.battuta.urlo .bolla{background:#3d2a10;border-color:var(--accento2);font-weight:bold}
.pensiero .bolla{color:var(--tenue);font-style:italic}
#avanti{position:sticky;bottom:0;z-index:20;padding:14px 0 12px;
  background:linear-gradient(180deg,rgba(8,13,24,0) 0%, rgba(8,13,24,.92) 32%, #080d18 100%)}
.scelte{margin-top:12px}

/* ---------- schede giocatore ---------- */
.scheda{display:flex;gap:10px;align-items:center;background:var(--pannello);
  border:1px solid var(--bordo);border-radius:12px;padding:9px 11px;margin-bottom:8px;
  width:100%;text-align:left}
.scheda .info{flex:1;min-width:0}
.scheda .nome{font-weight:bold;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scheda .sotto{font-size:12px;color:var(--tenue)}
.scheda .dx{text-align:right;font-size:12px;color:var(--tenue);flex:none}
.ruolo{display:inline-block;font-size:10px;font-weight:bold;padding:1px 6px;border-radius:5px;
  vertical-align:1px;margin-right:5px;letter-spacing:.5px}
.r-PT{background:#f2b32e;color:#231600}
.r-DF{background:#4aa8ff;color:#03192e}
.r-CC{background:#3fd07a;color:#03210f}
.r-AT{background:#ff5468;color:#2a020a}

.barra{height:6px;border-radius:99px;background:#0b1327;overflow:hidden;border:1px solid var(--bordo)}
.barra i{display:block;height:100%;border-radius:99px;
  background-image:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0));
  box-shadow:0 0 8px rgba(255,255,255,.12)}
.stat{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:13px}
.stat .n{width:74px;color:var(--tenue);flex:none}
.stat .v{width:34px;text-align:right;flex:none;font-weight:bold}
.stat .barra{flex:1}

/* ---------- partita ---------- */
#campo{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--bordo);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.028) 0 26px, rgba(0,0,0,.028) 26px 52px),
    linear-gradient(180deg,#15522f 0%, #0d3520 100%);
  height:168px;margin-bottom:10px}
.pedina{position:absolute;width:19px;height:19px;margin:-9.5px 0 0 -9.5px;border-radius:50%;
  display:grid;place-items:center;font-size:9px;font-weight:bold;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.85);box-shadow:0 1px 4px rgba(0,0,0,.5), 0 0 0 1.5px rgba(255,255,255,.45) inset;
  transition:left .42s cubic-bezier(.35,.9,.35,1), top .42s cubic-bezier(.35,.9,.35,1);z-index:2}
.pedina.pt{border-radius:6px}
.pedina.avv{box-shadow:0 1px 4px rgba(0,0,0,.55), 0 0 0 2px rgba(4,10,6,.55);filter:saturate(.9)}
.pedina.avv.pt{border-radius:6px}
.pedina.palla{box-shadow:0 1px 4px rgba(0,0,0,.5), 0 0 0 2px #ffd23f, 0 0 12px rgba(255,210,63,.75);
  width:22px;height:22px;margin:-11px 0 0 -11px;z-index:4}
.pedina.marca{box-shadow:0 1px 4px rgba(0,0,0,.5), 0 0 0 2px #ff5468, 0 0 10px rgba(255,84,104,.6);z-index:3}
#campo .linea{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.18)}
#campo .cerchio{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
  border:2px solid rgba(255,255,255,.18);border-radius:50%}
#campo .area{position:absolute;top:26px;bottom:26px;width:36px;border:2px solid rgba(255,255,255,.20);border-radius:2px}
#campo .areina{position:absolute;top:52px;bottom:52px;width:16px;border:2px solid rgba(255,255,255,.14)}
#campo .porta{position:absolute;top:60px;bottom:60px;width:7px;background:
  repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 1px, transparent 1px 4px),
  repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 4px);
  border:2px solid rgba(255,255,255,.7);border-radius:1px}
#campo .dischetto{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.5);margin:-1.5px 0 0 -1.5px}
#campo .angolo{position:absolute;width:12px;height:12px;border:2px solid rgba(255,255,255,.16);border-radius:50%}
#campo:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.35) 100%)}
#campo.gol-nostro{animation:lampoVerde .7s ease}
#campo.gol-loro{animation:lampoRosso .7s ease}
@keyframes lampoVerde{0%{box-shadow:inset 0 0 0 0 rgba(63,208,122,0)}25%{box-shadow:inset 0 0 60px 8px rgba(63,208,122,.65)}100%{box-shadow:inset 0 0 0 0 rgba(63,208,122,0)}}
@keyframes lampoRosso{0%{box-shadow:inset 0 0 0 0 rgba(255,84,104,0)}25%{box-shadow:inset 0 0 60px 8px rgba(255,84,104,.6)}100%{box-shadow:inset 0 0 0 0 rgba(255,84,104,0)}}
#campo .zone{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr)}
#campo .zona{border-right:1px dashed rgba(255,255,255,.08);display:grid;place-items:center}
#palla{position:absolute;width:16px;height:16px;z-index:5;border-radius:50%;background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.6), 0 0 0 2px rgba(0,0,0,.25);
  display:grid;place-items:center;font-size:12px;color:#111;
  transition:left .42s cubic-bezier(.35,.9,.35,1), top .42s ease;transform:translate(-50%,-50%);font-size:10px}
#tabellone{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
#tabellone .sq{flex:1;text-align:center;font-size:13px;font-weight:bold;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#tabellone .fascia{height:4px;border-radius:99px;margin-top:5px}
#tabellone .pt{font-size:30px;font-weight:bold;letter-spacing:2px;font-variant-numeric:tabular-nums}
#tabellone .tempo{font-size:12px;color:var(--tenue);text-align:center}
#log{max-height:210px;overflow-y:auto;background:#0a1226;
  border:1px solid var(--bordo);border-radius:12px;padding:10px;font-size:14px;margin-bottom:10px}
#log .l{margin-bottom:6px;animation:entra .2s ease}
#log .l:last-child{margin-bottom:0}
#log .ev{color:var(--accento);font-weight:bold}
#log .gol{color:var(--verde);font-weight:bold;font-size:16px}
#log .subito{color:var(--rosso);font-weight:bold}
#log .tec{color:#d9c2ff;font-weight:bold;background:linear-gradient(90deg, rgba(166,120,255,.22), transparent);
  border-left:3px solid var(--viola);padding:3px 8px;border-radius:0 8px 8px 0;margin:4px 0}
#log .gol{background:linear-gradient(90deg, rgba(63,208,122,.20), transparent);
  border-left:3px solid var(--verde);padding:4px 8px;border-radius:0 8px 8px 0;margin:5px 0}
#log .subito{background:linear-gradient(90deg, rgba(255,84,104,.18), transparent);
  border-left:3px solid var(--rosso);padding:4px 8px;border-radius:0 8px 8px 0;margin:5px 0}
#log .arb{color:var(--fioco);font-style:italic}
.duello{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 10px;
  background:#0a1226;border:1px solid var(--bordo);border-radius:12px;padding:8px}
.duello .vs{font-weight:bold;color:var(--accento);font-size:13px}
.duello .lato{flex:1;text-align:center;font-size:12px}
.duello .val{font-size:22px;font-weight:bold;font-variant-numeric:tabular-nums}

.tp{display:inline-block;font-size:11px;color:var(--viola);border:1px solid #4a3a7a;
  background:#1d1636;border-radius:6px;padding:0 5px;margin-left:4px}

/* ---------- varie ---------- */
.avviso{background:#3a2c10;border:1px solid #7a5c1a;border-radius:11px;padding:9px 12px;
  font-size:14px;margin-bottom:10px}
.buono{background:#12331f;border-color:#2c6b40;color:#bff5d0}
.male{background:#3a1622;border-color:#7a2338;color:#ffc4cd}
.velo{position:fixed;inset:0;background:rgba(4,8,18,.86);z-index:100;display:grid;place-items:center;
  padding:18px;backdrop-filter:blur(3px)}
.velo .box{background:var(--pannello);border:1px solid var(--bordo);border-radius:16px;
  padding:16px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--ombra)}
.titolone{font-size:34px;font-weight:bold;line-height:1;letter-spacing:-1px;
  background:linear-gradient(120deg,#fff 0%, var(--accento) 55%, var(--accento2) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px}
.fulmine{font-size:52px;line-height:1;filter:drop-shadow(0 0 14px rgba(255,210,63,.55))}
.nota{font-size:12px;color:var(--fioco);margin-top:10px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2a3a63;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
</style>

<script>
/* Amanome Eleven — versione da portare via, generata da strumenti/costruisci-unico.js */
window.AMANOME_UNICO = true;

/* ===== ie-volti.js ===== */
/* ============================================================
   AMANOME ELEVEN — volti
   Ritratti disegnati in SVG dal gioco stesso: nessuna immagine da
   scaricare, nessun disegno di altri. Ogni personaggio è una
   combinazione di taglio, colori, occhi, bocca e un dettaglio.
   ============================================================ */
(function () {
'use strict';
var IE = window.IE = window.IE || {};

IE.pelli = {
  chiara:  '#f6d9c2', media: '#e8bd9a', ambra: '#d29a6e',
  bruna:   '#a9714a', scura: '#7c4d31', pallida: '#f7e3d6'
};
IE.capelliCol = {
  nero:'#241f2b', corvino:'#101018', castano:'#5a3a24', cioccolato:'#3d2a1c',
  rame:'#a8471f', rosso:'#c0392b', biondo:'#d9b45a', cenere:'#b9bcc4',
  bianco:'#e6e9ef', verde:'#2f7a52', blu:'#2c4f8a', viola:'#5c3f86', rosa:'#c0658a'
};

IE.tagli = ['corti','punte','caschetto','lunghi','coda','mossi','rasati','ciuffo','raccolti','radi','treccine','ricci'];
IE.occhiTipi = ['normali','decisi','grandi','stanchi','felici','severi','chiusi'];
IE.bocche = ['neutra','sorriso','sorrisone','seria','aperta','piccola'];
IE.dettagli = ['niente','fascia','occhiali','visiera','cerotto','lentiggini','berretto','bandana'];

function scuro(hex, q) {
  var n = parseInt(hex.slice(1), 16);
  var r = Math.round(((n >> 16) & 255) * q), g = Math.round(((n >> 8) & 255) * q), b = Math.round((n & 255) * q);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------- capelli: strato dietro la testa ---------- */
function dietro(t, c) {
  var s = scuro(c, .82);
  switch (t) {
    case 'lunghi':
      return '<path d="M20 44 q0 34 -3 44 h66 q-3 -10 -3 -44 z" fill="' + s + '"/>';
    case 'coda':
      return '<path d="M22 42 q-2 26 -4 34 h12 q-2 -18 0 -34 z" fill="' + s + '"/>' +
             '<path d="M74 34 q16 6 14 26 q-2 16 -12 20 q6 -22 -6 -36 z" fill="' + s + '"/>';
    case 'mossi':
      return '<path d="M20 42 q-2 24 2 32 q6 -6 4 -18 z M80 42 q2 24 -2 32 q-6 -6 -4 -18 z" fill="' + s + '"/>';
    case 'caschetto':
      return '<path d="M21 40 q-1 22 1 30 h56 q2 -8 1 -30 z" fill="' + s + '"/>';
    case 'treccine':
      return '<path d="M22 44 q-4 24 -2 34 h10 q-4 -18 -1 -34 z M78 44 q4 24 2 34 h-10 q4 -18 1 -34 z" fill="' + s + '"/>';
    case 'ricci':
      return '<circle cx="26" cy="34" r="12" fill="' + s + '"/><circle cx="74" cy="34" r="12" fill="' + s + '"/>' +
             '<circle cx="50" cy="24" r="14" fill="' + s + '"/>';
    case 'raccolti':
      return '<circle cx="50" cy="15" r="9" fill="' + s + '"/>';
    default: return '';
  }
}

/* ---------- capelli: strato davanti ---------- */
function davanti(t, c) {
  var l = scuro(c, 1.12);
  switch (t) {
    case 'corti':
      return '<path d="M24 44 q0 -26 26 -26 q26 0 26 26 q-4 -14 -26 -14 q-22 0 -26 14 z" fill="' + c + '"/>';
    case 'punte':
      return '<path d="M24 46 q-1 -24 26 -26 q27 2 26 26 l-5 -12 l-4 8 l-5 -13 l-5 10 l-6 -14 l-5 12 l-5 -9 l-5 12 l-4 -8 z" fill="' + c + '"/>';
    case 'caschetto':
      return '<path d="M22 46 q0 -28 28 -28 q28 0 28 28 q-6 -16 -18 -16 q-4 12 -22 10 q-10 -1 -16 6 z" fill="' + c + '"/>';
    case 'lunghi':
      return '<path d="M22 48 q0 -30 28 -30 q28 0 28 30 q-4 -18 -14 -20 q-10 8 -26 6 q-12 -1 -16 14 z" fill="' + c + '"/>';
    case 'coda':
      return '<path d="M23 44 q1 -26 27 -26 q26 0 27 26 q-6 -16 -20 -17 q-12 6 -22 5 q-8 0 -12 12 z" fill="' + c + '"/>';
    case 'mossi':
      return '<path d="M23 46 q0 -28 27 -28 q27 0 27 28 q-5 -10 -11 -6 q-5 -9 -12 -4 q-6 -8 -13 -2 q-6 -4 -9 6 z" fill="' + c + '"/>';
    case 'rasati':
      return '<path d="M26 40 q1 -21 24 -21 q23 0 24 21 q-7 -7 -24 -7 q-17 0 -24 7 z" fill="' + c + '" opacity=".85"/>' +
             '<path d="M28 34 q22 -8 44 0" stroke="' + l + '" stroke-width="1.2" fill="none" opacity=".45"/>';
    case 'ciuffo':
      return '<path d="M23 46 q0 -28 27 -28 q27 0 27 28 q-4 -15 -19 -17 q-17 -2 -25 9 q-5 7 -10 8 z" fill="' + c + '"/>' +
             '<path d="M60 20 q16 5 17 25 l-6 1 q3 -15 -11 -21 z" fill="' + c + '"/>' +
             '<path d="M44 20 q20 2 24 13 q-5 17 -21 23 q9 -19 -3 -36 z" fill="' + l + '" opacity=".95"/>';
    case 'raccolti':
      return '<path d="M24 42 q1 -24 26 -24 q25 0 26 24 q-8 -12 -26 -12 q-18 0 -26 12 z" fill="' + c + '"/>';
    case 'radi':
      return '<path d="M25 44 q2 -12 10 -16 q-3 8 -2 14 z M75 44 q-2 -12 -10 -16 q3 8 2 14 z" fill="' + c + '"/>';
    case 'treccine':
      return '<path d="M24 44 q0 -26 26 -26 q26 0 26 26 q-6 -14 -26 -14 q-20 0 -26 14 z" fill="' + c + '"/>' +
             '<path d="M32 22 v10 M42 19 v11 M50 18 v12 M58 19 v11 M68 22 v10" stroke="' + l + '" stroke-width="1.6" opacity=".7"/>';
    case 'ricci':
      return '<path d="M25 44 q0 -24 25 -24 q25 0 25 24 q-8 -12 -25 -12 q-17 0 -25 12 z" fill="' + c + '"/>';
    default:
      return '<path d="M24 44 q0 -26 26 -26 q26 0 26 26 q-4 -14 -26 -14 q-22 0 -26 14 z" fill="' + c + '"/>';
  }
}

/* ---------- occhi ---------- */
function occhi(t) {
  var b = '#241f2b';
  function o(x, r, ry) { return '<ellipse cx="' + x + '" cy="47" rx="' + r + '" ry="' + ry + '" fill="#fff"/>' +
    '<circle cx="' + x + '" cy="47.5" r="' + (r * .62) + '" fill="' + b + '"/>' +
    '<circle cx="' + (x + r * .3) + '" cy="46" r="' + (r * .22) + '" fill="#fff" opacity=".9"/>'; }
  switch (t) {
    case 'grandi':  return o(39, 6, 6.4) + o(61, 6, 6.4);
    case 'decisi':  return o(39, 5, 3.6) + o(61, 5, 3.6) +
      '<path d="M33 41 l12 3 M67 41 l-12 3" stroke="' + b + '" stroke-width="2.6" stroke-linecap="round"/>';
    case 'stanchi': return o(39, 4.6, 3.4) + o(61, 4.6, 3.4) +
      '<path d="M34 52 q5 2 10 0 M56 52 q5 2 10 0" stroke="#b98d86" stroke-width="1.4" fill="none" opacity=".8"/>';
    case 'felici':  return '<path d="M34 49 q5 -8 10 0 M56 49 q5 -8 10 0" stroke="' + b + '" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    case 'chiusi':  return '<path d="M34 47 q5 4 10 0 M56 47 q5 4 10 0" stroke="' + b + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
    case 'severi':  return o(39, 5, 3) + o(61, 5, 3) +
      '<path d="M33 42 h12 M55 42 h12" stroke="' + b + '" stroke-width="2.8" stroke-linecap="round"/>';
    default:        return o(39, 5.2, 4.6) + o(61, 5.2, 4.6);
  }
}

/* ---------- sopracciglia ---------- */
function ciglia(t, c) {
  var s = scuro(c, .7);
  var d = {
    normali: 'M33 37 q6 -3 12 -1 M67 37 q-6 -3 -12 -1',
    decisi:  'M33 35 q6 1 12 3 M67 35 q-6 1 -12 3',
    grandi:  'M33 36 q6 -4 12 -1 M67 36 q-6 -4 -12 -1',
    stanchi: 'M33 36 q6 2 12 3 M67 36 q-6 2 -12 3',
    felici:  'M33 36 q6 -4 12 -1 M67 36 q-6 -4 -12 -1',
    severi:  'M32 34 q7 2 13 4 M68 34 q-7 2 -13 4',
    chiusi:  'M33 37 q6 -2 12 -1 M67 37 q-6 -2 -12 -1'
  }[t] || 'M33 37 q6 -3 12 -1 M67 37 q-6 -3 -12 -1';
  return '<path d="' + d + '" stroke="' + s + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
}

/* ---------- bocca ---------- */
function bocca(t) {
  var b = '#8c4a4a';
  switch (t) {
    case 'sorriso':   return '<path d="M43 58 q7 6 14 0" stroke="' + b + '" stroke-width="2" fill="none" stroke-linecap="round"/>';
    case 'sorrisone': return '<path d="M41 57 q9 10 18 0 z" fill="#7a3540"/><path d="M42 58 q8 2 16 0" stroke="#fff" stroke-width="2" fill="none"/>';
    case 'seria':     return '<path d="M43 59 h14" stroke="' + b + '" stroke-width="2.2" stroke-linecap="round"/>';
    case 'aperta':    return '<ellipse cx="50" cy="59" rx="5" ry="4" fill="#7a3540"/>';
    case 'piccola':   return '<path d="M47 59 h6" stroke="' + b + '" stroke-width="2.2" stroke-linecap="round"/>';
    default:          return '<path d="M45 59 q5 3 10 0" stroke="' + b + '" stroke-width="2" fill="none" stroke-linecap="round"/>';
  }
}

/* ---------- dettaglio ---------- */
function dettaglio(t, col) {
  switch (t) {
    case 'fascia':    return '<path d="M23 33 q27 -10 54 0 v7 q-27 -9 -54 0 z" fill="' + (col || '#e8703a') + '"/>' +
      '<path d="M23 36 h54" stroke="rgba(0,0,0,.18)" stroke-width="1.2"/>';
    case 'occhiali':  return '<g fill="none" stroke="#2b3450" stroke-width="2.2">' +
      '<rect x="30" y="41" width="18" height="12" rx="3"/><rect x="52" y="41" width="18" height="12" rx="3"/>' +
      '<path d="M48 47 h4 M30 46 l-6 1 M70 46 l6 1"/></g>' +
      '<rect x="30" y="41" width="18" height="12" rx="3" fill="#9fd0ff" opacity=".22"/>' +
      '<rect x="52" y="41" width="18" height="12" rx="3" fill="#9fd0ff" opacity=".22"/>';
    case 'visiera':   return '<path d="M24 40 h52 v11 h-52 z" fill="#1d2740" opacity=".92"/>' +
      '<path d="M27 43 h18 v5 h-18 z M55 43 h18 v5 h-18 z" fill="#7fc7ff" opacity=".55"/>' +
      '<path d="M24 40 h52" stroke="#e8c14a" stroke-width="2"/>';
    case 'cerotto':   return '<g transform="rotate(-18 66 40)"><rect x="59" y="36" width="15" height="6" rx="2" fill="#f3e2c8"/>' +
      '<path d="M63 37.5 v3 M67 37.5 v3 M71 37.5 v3" stroke="#d9c3a1" stroke-width="1"/></g>';
    case 'lentiggini':return '<g fill="#c98a63" opacity=".8"><circle cx="36" cy="53" r="1"/><circle cx="40" cy="55" r="1"/>' +
      '<circle cx="44" cy="53" r="1"/><circle cx="56" cy="53" r="1"/><circle cx="60" cy="55" r="1"/><circle cx="64" cy="53" r="1"/></g>';
    case 'berretto':  return '<path d="M21 31 q29 -23 58 0 z" fill="' + (col || '#3a4a66') + '"/>' +
      '<path d="M19 30 q31 7 62 0 v5 q-31 7 -62 0 z" fill="' + scuro(col || '#3a4a66', .75) + '"/>' +
      '<path d="M19 33 q31 12 62 0 v3 q-31 11 -62 0 z" fill="' + scuro(col || '#3a4a66', .55) + '" opacity=".85"/>';
    case 'bandana':   return '<path d="M22 34 q28 -12 56 0 v6 q-28 -10 -56 0 z" fill="' + (col || '#5f9a7a') + '"/>' +
      '<path d="M76 37 l12 6 l-11 2 z" fill="' + scuro(col || '#5f9a7a', .8) + '"/>';
    default: return '';
  }
}

/* ============================================================
   IE.volto(v) → SVG
   v: { pelle, capelli, taglio, occhi, bocca, extra, extraCol, maglia }
   ============================================================ */
IE.volto = function (v, opz) {
  v = v || {};
  opz = opz || {};
  var pelle = IE.pelli[v.pelle] || v.pelle || IE.pelli.media;
  var cap = IE.capelliCol[v.capelli] || v.capelli || IE.capelliCol.nero;
  var taglio = v.taglio || 'corti';
  var occ = v.occhi || 'normali';
  var boc = v.bocca || 'neutra';
  var maglia = v.maglia || opz.maglia || '#2f9e63';
  var sfondo = opz.sfondo;

  return '<svg class="volto" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    (sfondo ? '<rect width="100" height="100" rx="22" fill="' + sfondo + '"/>' : '') +
    '<circle cx="50" cy="46" r="34" fill="rgba(0,0,0,.16)"/>' +
    /* spalle e maglia */
    '<path d="M6 100 q2 -19 24 -25 l40 0 q22 6 24 25 z" fill="' + maglia + '"/>' +
    '<path d="M42 72 h16 l-8 12 z" fill="' + scuro(maglia, .7) + '"/>' +
    /* collo */
    '<path d="M42 62 h16 v11 q-8 5 -16 0 z" fill="' + scuro(pelle, .86) + '"/>' +
    dietro(taglio, cap) +
    /* orecchie e testa */
    '<ellipse cx="24" cy="48" rx="4.5" ry="6" fill="' + pelle + '"/>' +
    '<ellipse cx="76" cy="48" rx="4.5" ry="6" fill="' + pelle + '"/>' +
    '<ellipse cx="50" cy="45" rx="26" ry="30" fill="' + pelle + '"/>' +
    davanti(taglio, cap) +
    ciglia(occ, cap) +
    occhi(occ) +
    '<path d="M50 49 v6 q-2 1 -3 1" stroke="' + scuro(pelle, .74) + '" stroke-width="1.6" fill="none" stroke-linecap="round"/>' +
    bocca(boc) +
    dettaglio(v.extra, v.extraCol) +
    '</svg>';
};

/* ---------- volto casuale ---------- */
IE.voltoCasuale = function () {
  function s(a) { return a[Math.floor(Math.random() * a.length)]; }
  return {
    pelle: s(Object.keys(IE.pelli)), capelli: s(Object.keys(IE.capelliCol)),
    taglio: s(IE.tagli), occhi: s(IE.occhiTipi), bocca: s(IE.bocche),
    extra: Math.random() < .35 ? s(IE.dettagli) : 'niente'
  };
};

/* ============================================================
   VOLTI DEI PERSONAGGI
   ============================================================ */
IE.volti = {
  tu:      { pelle:'media',   capelli:'castano',   taglio:'punte',     occhi:'decisi',  bocca:'sorriso',   extra:'niente' },
  rei:     { pelle:'chiara',  capelli:'cioccolato',taglio:'corti',     occhi:'felici',  bocca:'sorrisone', extra:'niente' },
  goro:    { pelle:'ambra',   capelli:'nero',      taglio:'rasati',    occhi:'severi',  bocca:'seria',     extra:'niente' },
  hina:    { pelle:'chiara',  capelli:'corvino',   taglio:'coda',      occhi:'severi',  bocca:'seria',     extra:'niente' },
  zero:    { pelle:'pallida', capelli:'biondo',    taglio:'ciuffo',    occhi:'stanchi', bocca:'seria',     extra:'niente' },
  minoru:  { pelle:'chiara',  capelli:'rame',      taglio:'punte',     occhi:'grandi',  bocca:'aperta',    extra:'lentiggini' },
  kenta:   { pelle:'chiara',  capelli:'castano',   taglio:'caschetto', occhi:'normali', bocca:'piccola',   extra:'occhiali' },
  yuki:    { pelle:'media',   capelli:'verde',     taglio:'mossi',     occhi:'felici',  bocca:'sorriso',   extra:'niente' },

};

/* ============================================================
   CALCOLO DELLE STATISTICHE
   ============================================================ */
IE.statoDi = function (g, chiave) {
  var prof = IE.profili[g.prof] || IE.profili.tuttofare;
  var base = (g.base && g.base[chiave]) || 0;
  var bonus = (g.bonus && g.bonus[chiave]) || 0;
  var cresc = prof[chiave] * (Math.max(1, g.lv || 1) - 1) * (g.pot || 1);
  var extra = (g.allen && g.allen[chiave]) || 0;
  var v = Math.round(base + bonus + cresc + extra);
  return Math.max(1, Math.min(160, v));
};
IE.tutteStat = function (g) {
  var o = {};
  IE.ordineStat.forEach(function (k) { o[k] = IE.statoDi(g, k); });
  return o;
};
IE.tpMax = function (g) { return 60 + Math.round(IE.statoDi(g, 'gri') * 0.8) + Math.round((g.lv || 1) * 1.5); };
IE.fpMax = function (g) { return 70 + Math.round(IE.statoDi(g, 'res') * 0.9) + Math.round((g.lv || 1) * 1.2); };

/* Valutazione sintetica, per le liste. */
IE.valutazione = function (g) {
  var s = IE.tutteStat(g), tot;
  if (g.ruolo === 'PT') tot = s.par * 2.2 + s.gri * 1.2 + s.dif + s.fis * .8 + s.res * .6;
  else if (g.ruolo === 'DF') tot = s.dif * 1.8 + s.fis * 1.3 + s.vel * .9 + s.res * .8 + s.gri * .8;
  else if (g.ruolo === 'CC') tot = s.ctr * 1.8 + s.vel * 1.1 + s.res * 1.1 + s.dif * .9 + s.gri * .9 + s.tir * .6;
  else tot = s.tir * 1.8 + s.vel * 1.2 + s.ctr * 1.1 + s.fis * .9 + s.gri * .8;
  return Math.round(tot / 6.5);
};

/* Crea l'istanza giocabile di un personaggio del listino. */
IE.creaGiocatore = function (id, lv) {
  var m = IE.personaggi[id];
  if (!m) return null;
  var g = {
    id: id, nome: m.nome, corto: m.corto, ruolo: m.ruolo, el: m.el, col: m.col,
    prof: m.prof, pot: m.pot, base: Object.assign({}, m.base), allen: {},
    lv: lv || 1, exp: 0, tec: (m.tec || []).slice(), numero: 0
  };
  g.tp = IE.tpMax(g); g.fp = IE.fpMax(g);
  return g;
};

/* ============================================================
   AVVERSARI — nomi di riempimento e generatore di rose
   ============================================================ */
var COGNOMI = ['Kagawa','Morita','Yasuda','Tokunaga','Iwase','Shindō','Kurata','Nomura','Ōbayashi',
  'Serizawa','Tanigawa','Hoshino','Uehara','Mizuki','Kanda','Andō','Fujisaki','Kunimitsu','Terada',
  'Nakabayashi','Ozaki','Hayami','Sugimoto','Katayama','Momoi','Ryūzaki','Shikimi','Nishio','Ōgami','Tsuruta'];
var NOMI = ['Ren','Sōta','Kaito','Haruto','Yūma','Riku','Asahi','Takumi','Sora','Hinata','Jun',
  'Kōki','Naoya','Tetsu','Shun','Masaki','Ryō','Itsuki','Daigo','Kōsei'];

function rngDa(seme) {
  var s = 0; for (var i = 0; i < seme.length; i++) s = (s * 31 + seme.charCodeAt(i)) >>> 0;
  return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* Genera una rosa completa: parte dai titolari nominati e riempie il resto. */
function nomeLibero(r, usati) {
  for (var t = 0; t < 200; t++) {
    var c = COGNOMI[Math.floor(r() * COGNOMI.length)];
    if (usati[c]) continue;
    var nm = NOMI[Math.floor(r() * NOMI.length)] + ' ' + c;
    if (!usati[nm]) return nm;
  }
  var nm2; do { nm2 = NOMI[Math.floor(r() * NOMI.length)] + ' ' + COGNOMI[Math.floor(r() * COGNOMI.length)]; } while (usati[nm2]);
  return nm2;
}

IE.rosaSquadra = function (sq) {
  var r = rngDa(sq.id), rosa = [], usati = {}, i;
  (sq.chiave || []).forEach(function (c, idx) {
    var g = {
      id: sq.id + '_' + (c.id || idx), nome: c.nome, corto: c.corto || c.nome.split(' ')[0],
      ruolo: c.ruolo, el: c.el || 'neutro', col: c.col || sq.col, prof: c.prof || 'tuttofare',

sc({ id: 'n_c4', luogo: 'Alimentari Kirishima — la radio sopra il banco frigo',

    d('kenta', "Alla Raimon."),

sc({ id: 'c6_jude', luogo: 'Il campo dietro la palestra',

    d('jude', "Voleva che gli altri perdessero. Sembrano la stessa cosa e non lo sono per niente."),
    d('jude', "Se vuoi vincere, alleni undici persone. Se vuoi che gli altri perdano, ti servono undici strumenti. E gli strumenti non è necessario che stiano bene."),

    n("Jude si rimette gli occhiali e guarda il campo: novantuno metri per cinquantatré, tracciato a mano, con una porta ancora piegata."),
    d('jude', "Posso dirti una cosa io adesso?"),

sc({ id: 'c3b_1', luogo: 'Sala professori — primi di giugno',

    n("Silenzio. La corriera per la città passa due volte al giorno e non va in nessuno di quei posti."),

sc({ id: 'c3b_nao', luogo: 'Alimentari Kirishima — dopo la chiusura',

/* ============================================================
   TASTIERA
   Da computer si gioca senza toccare il mouse.
   ============================================================ */
var TASTI_MAX = 9;

function bottoniNumerabili() {
  var velo = document.querySelector('.velo');
  var dove = velo || schermo;
  if (!dove) return [];
  return [].slice.call(dove.querySelectorAll('button.bt'))
    .filter(function (b) {
      return !b.classList.contains('disab') && !b.classList.contains('piatta') && b.offsetParent !== null;
    })
    .slice(0, TASTI_MAX);
}

function numeraTasti() {
  if (!document.body.classList.contains('tastiera')) return;
  bottoniNumerabili().forEach(function (b, i) {
    if (b.querySelector('.tasto')) return;
    var t = document.createElement('span');
    t.className = 'tasto';
    t.textContent = i + 1;
    b.insertBefore(t, b.firstChild);
  });
}

function bottonePrincipale() {
  var velo = document.querySelector('.velo');
  var dove = velo || schermo;
  if (!dove) return null;
  var b = dove.querySelector('button.bt.primario:not(.disab), button.bt.verde:not(.disab)');
  if (b) return b;
  return bottoniNumerabili()[0] || null;
}

function bottoneIndietro() {
  var velo = document.querySelector('.velo');
  if (velo) return velo.querySelector('button');
  if (!schermo) return null;
  return [].slice.call(schermo.querySelectorAll('button')).filter(function (b) {
    return /◀|Torna|Chiudi|Annulla/.test(b.textContent);
  }).pop() || null;
}

function attivaTastiera() {
  if (document.body.classList.contains('tastiera')) return;
  document.body.classList.add('tastiera');
  numeraTasti();
}

document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) {
    if (e.key === 'Enter') { var pr = bottonePrincipale(); if (pr) { e.preventDefault(); pr.click(); } }
    return;
  }
  attivaTastiera();

  if (e.key >= '1' && e.key <= '9') {
    var b = bottoniNumerabili()[parseInt(e.key, 10) - 1];
    if (b) { e.preventDefault(); b.click(); }
    return;
  }
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
    var p = bottonePrincipale();
    if (p) { e.preventDefault(); p.click(); }
    return;
  }
  if (e.key === 'Escape' || e.key === 'ArrowLeft' || e.key === 'Backspace') {
    var i = bottoneIndietro();
    if (i) { e.preventDefault(); i.click(); }
    return;
  }
  if (e.key === 's' || e.key === 'S') {
    var salta = schermo && [].slice.call(schermo.querySelectorAll('button')).filter(function (x) {
      return /Salta la scena/.test(x.textContent);
    })[0];
    if (salta) { e.preventDefault(); salta.click(); }
  }
});

/* ============================================================
   PEZZI RIUSABILI
   ============================================================ */
function ritrattoHtml(g, cls) {
  var el2 = g.el ? '<span class="el">' + IE.elementi[g.el].icona + '</span>' : '';
  var v = IE.voltoDi(g);
  var faccia = IE.volto(v, { maglia: v.maglia || g.col });
  var anello = g.el && IE.elementi[g.el] ? IE.elementi[g.el].col : 'transparent';
  return '<div class="ritratto ' + (cls || '') + '" style="--anello:' + anello +
    ';background:linear-gradient(150deg,' + (g.col || '#888') + ',' + ombra(g.col || '#888') + ')">' +
    faccia + el2 + '</div>';
}
function ombra(hex) {
  try {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * 0.55), gg = Math.round(((n >> 8) & 255) * 0.55), b = Math.round((n & 255) * 0.55);
    return 'rgb(' + r + ',' + gg + ',' + b + ')';
  } catch (e) { return '#333'; }
}
function statHtml(st, ruolo) {
  return IE.ordineStat.filter(function (k) { return k !== 'par' || ruolo === 'PT'; }).map(function (k) {
    var v = st[k], p = Math.min(100, v / 1.3);
    return '<div class="stat"><span class="n">' + IE.stat[k].nome + '</span>' +
      '<span class="barra"><i style="width:' + p + '%;background:' + IE.stat[k].col + '"></i></span>' +
      '<span class="v">' + v + '</span></div>';
  }).join('');
}
function schedaGiocatore(g, dx, fn) {
  var b = document.createElement('button');
  b.className = 'scheda';
  b.innerHTML = ritrattoHtml(g) +
    '<div class="info"><div class="nome">' + esc(g.nome) + (g.capitano ? ' <span class="tenue">(C)</span>' : '') + '</div>' +
    '<div class="sotto"><span class="ruolo r-' + g.ruolo + '">' + g.ruolo + '</span>n. ' + g.numero + ' · Lv ' + g.lv +
    ' · val. ' + IE.valutazione(g) + '</div></div>' +
    '<div class="dx">' + (dx || '') + '</div>';
  if (fn) b.onclick = fn; else b.style.cursor = 'default';
  return b;
}

      S.riga = righe.length - 1; salva(); render(); ancoraGiu();

    salta.style.marginTop = '4px';
    piede.appendChild(salta);
  } else {
    if (sc.scelte && sc.scelte.length) {
      var d = el('<div class="scelte"><div class="etichetta">Cosa dici</div></div>');
      sc.scelte.filter(function (x) { return !x.se || x.se(S, carattere(), tratti()); }).forEach(function (s) {
        d.appendChild(bt(s.t, s.nota || null, function () {
          applica(sc.eff); applica(s.eff);
          S.scena = null;
          if (s.vai) apriScena(s.vai); else G.vai('hub');
        }));
      });
      piede.appendChild(d);
    } else {
      piede.appendChild(bt('Continua ▸', null, function () { finiScena(); }, 'primario'));
    }
  }
  ancoraGiu();
}
function ancoraGiu() {
  setTimeout(function () { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 30);
}
function carattere() { return (S.io && S.io.carattere) || 'ostinato'; }
function tratti() {
  if (!S.io) return { cuore: 0, testa: 0, schiena: 0 };
  if (!S.io.tratti) S.io.tratti = { cuore: 0, testa: 0, schiena: 0 };
  return S.io.tratti;
}

/* Una battuta può avere una versione diversa per ogni carattere. */
function vociDi(r) {
  if (!r.v) return r.t;
  return r.v[carattere()] || r.v.base || r.t || '';
}

function testoScena(t) {
  if (t.indexOf('{') < 0) return t;
  var sc = IE.storia.scene[S.scena] || {};
  var nuovi = 0;
  (sc.eff || []).forEach(function (e) { if (e.recluta && !S.ha(e.recluta)) nuovi++; });
  return t.replace(/\{N\}/g, S.rosa.length + nuovi)
          .replace(/\{SQ\}/g, S.nomeSquadra)
          .replace(/\{IO\}/g, S.io ? S.io.nome : 'tu');
}
function battutaHtml(r) {
  r = { chi: r.chi, t: testoScena(vociDi(r)), cls: r.cls };
  if (r.chi === 'narr') return el('<div class="battuta narr ' + (r.cls || '') + '"><div class="bolla">' + esc(r.t) + '</div></div>');
  var p, io = false;
  if (r.chi === 'tu') { p = S.io || { nome: 'Tu', corto: 'Tu', col: '#ffd23f' }; io = true; }
  else p = IE.personaggi[r.chi] || { nome: r.chi, corto: r.chi, col: '#888' };
  return el('<div class="battuta ' + (io ? 'io ' : '') + (r.cls || '') + '">' +
    ritrattoHtml(p, 'pc') +
    '<div class="corpo"><div class="chi">' + esc(p.nome) + '</div>' +
    '<div class="bolla">' + esc(r.t) + '</div></div></div>');
}

function barraFatica() {
  var m = faticaMedia();
  var col = m > 60 ? '#3fd07a' : m > 30 ? '#ffd23f' : '#ff5468';
  return el('<div class="pannello stretto"><div class="stat" style="margin:0">' +
    '<span class="n">Fiato</span><span class="barra"><i style="width:' + m + '%;background:' + col + '"></i></span>' +
    '<span class="v">' + m + '</span></div>' +
    '<div class="picc fioco" style="margin-top:6px">Ogni esercizio consuma fiato. Si recupera tutto giocando una partita.</div></div>');
}

function chiSiAllena(a) {
  if (a.tutti) return S.rosa.slice();
  return S.rosa.filter(function (g) { return (a.ruoli || []).indexOf(g.ruolo) >= 0; });
}

function faiAllenamento(a) {
  var chi = chiSiAllena(a).filter(function (g) { return fatica(g) >= a.fat; });
  if (!chi.length) return;
  var righe = [], nuoveTec = [];
  chi.forEach(function (g) {
    g.fat = Math.max(0, fatica(g) - a.fat);
    g.allen = g.allen || {};
    a.su.forEach(function (k) {
      if (k === 'par' && g.ruolo !== 'PT') return;
      g.allen[k] = (g.allen[k] || 0) + a.q;
    });
    var r = daiExp(g, a.exp || 100);
    if (r.salito.length) righe.push(esc(g.nome) + ' sale al livello ' + g.lv + '.');
    r.imparate.forEach(function (t) { righe.push('<b>' + esc(g.nome) + ' impara ' + esc(IE.tec(t).nome) + '</b>'); });
  });
  /* qualcuno, ogni tanto, si porta a casa una tecnica nuova */
  if (Math.random() < 0.45) {
    var g2 = chi[Math.floor(Math.random() * chi.length)];
    var t2 = tecnicaNuovaPer(g2, a);
    if (t2) { g2.tec.push(t2); nuoveTec.push(esc(g2.nome) + ' ha imparato <b>' + esc(IE.tec(t2).nome) + '</b>'); }
  }
  if (a.spirito) S.spirito = Math.min(100, S.spirito + a.spirito);
  salva();

  var risveglio = cercaRisveglio('allenamento', a.id);
  velo('<h2>' + a.icona + ' ' + esc(a.nome) + '</h2>' +
    '<p class="picc">' + esc(a.desc) + '</p>' +
    '<p class="picc tenue">Hanno lavorato in ' + chi.length + '. ' +
    a.su.map(function (k) { return IE.stat[k].nome + ' +' + a.q; }).join(', ') + '. Fiato −' + a.fat + '.</p>' +
    (nuoveTec.length ? '<div class="avviso picc">' + nuoveTec.join('<br>') + '</div>' : '') +
    (righe.length ? '<div class="avviso buono picc">' + righe.join('<br>') + '</div>' : '') +
    '<button class="bt primario" id="chiudiAll">Chiudi</button>');
  document.getElementById('chiudiAll').onclick = function () {
    var v = document.querySelector('.velo'); if (v) v.remove();
    if (risveglio) mostraRisveglio(risveglio.scena, risveglio.g); else render();
  };
}

/* Una tecnica comune che quel giocatore non ha ancora e che c\'entra con l\'esercizio. */
function tecnicaNuovaPer(g, a) {
  var tipi = [];
  if (a.su.indexOf('tir') >= 0) tipi.push('tiro');
  if (a.su.indexOf('par') >= 0 && g.ruolo === 'PT') tipi.push('parata');
  if (a.su.indexOf('dif') >= 0 || a.su.indexOf('fis') >= 0) tipi.push('blocco');
  if (a.su.indexOf('ctr') >= 0 || a.su.indexOf('vel') >= 0) tipi.push('drib');
  if (!tipi.length) tipi = g.ruolo === 'PT' ? ['parata'] : ['drib'];
  if (g.ruolo === 'PT') tipi = tipi.filter(function (t) { return t === 'parata' || t === 'blocco'; });
  if (!tipi.length) return null;
  var tipo = tipi[Math.floor(Math.random() * tipi.length)];
  var pool = (IE.imparabili[tipo] || []).filter(function (id) {
    var t = IE.tec(id);
    return t && g.tec.indexOf(id) < 0 && t.pot <= 24 + g.lv * 2.2;
  });
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ============================================================
   I RISVEGLI
   Ogni ragazzo ha una tecnica sua. Non la impara: gli succede.
   ============================================================ */
function cercaRisveglio(dove, eserc) {
  S.risvegli = S.risvegli || {};
  for (var i = 0; i < S.rosa.length; i++) {
    var g = S.rosa[i], f = IE.firme[g.id];
    if (!f || S.risvegli[g.id]) continue;
    if (f.dove !== dove || g.lv < f.lv) continue;
    if (dove === 'allenamento' && f.eserc !== eserc) continue;
    return { g: g, scena: f.scena, f: f };
  }
  return null;
}

function cercaRisveglioPartita() {
  S.risvegli = S.risvegli || {};
  for (var i = 0; i < P.mia.rosa.length; i++) {
    var c = P.mia.rosa[i], g = c._orig;
    if (!g) continue;
    var f = IE.firme[g.id];
    if (!f || S.risvegli[g.id] || f.dove !== 'partita' || g.lv < f.lv) continue;
    if (!IE.condizioneFirma(P, c, f.cond)) continue;
    return { g: g, clone: c, scena: f.scena, f: f };
  }
  return null;
}

function concediFirma(g, f, clone) {
  var tec = f.tec || IE.firmaTua(g.ruolo);
  if (!IE.tec(tec)) return null;
  if (g.tec.indexOf(tec) < 0) g.tec.push(tec);
  if (!g.eq || !g.eq.length) equipaggiaAuto(g);
  if (g.eq.indexOf(tec) < 0) {
    if (g.eq.length < SLOT) g.eq.push(tec);
    else {
      /* esce la più debole dello stesso tipo, altrimenti la più debole in assoluto */
      var mio = IE.tec(tec);
      var cand = g.eq.map(IE.tec).filter(Boolean);
      var stesso = cand.filter(function (t) { return t.tipo === mio.tipo; });
      var fuori = (stesso.length ? stesso : cand).sort(function (a, b) { return a.pot - b.pot; })[0];
      g.eq[g.eq.indexOf(fuori.id)] = tec;
    }
  }
  S.risvegli[g.id] = tec;
  /* se sta giocando adesso, la può usare subito */
  if (clone) { clone.tec = g.tec.slice(); clone.eq = g.eq.slice(); }
  return tec;
}

function apriRisveglio(r, ritorno) {
  G.risv = { scena: r.scena, gioc: r.g.id, riga: 0, ritorno: ritorno || 'hub', f: r.f, clone: r.clone || null };

    }, 'primario'));
  }
  ancoraGiu();

/* ============================================================
   PARTITA
   ============================================================ */
function clona(g) {
  var c = {};
  for (var k in g) if (k.charAt(0) !== '_') c[k] = g[k];
  c.tec = (g.tec || []).slice();
  c.eq = (g.eq && g.eq.length ? g.eq : equipaggiaAuto(g)).slice();
  c.tp = IE.tpMax(g);          /* in partita si entra sempre pieni: */
  c.fp = IE.fpMax(g);          /* il fiato degli allenamenti è un'altra cosa */
  c.baseId = g.id;
  c._orig = g;
  return c;
}
function avviaPartita(cfg) {
  if (cfg.avv === 'versione') { cfg = Object.assign({}, cfg, { avv: squadraVersione() }); }
  if (!IE.squadre[cfg.avv]) { G.vai('hub'); return; }
  S.partitaPendente = cfg;

}

function scendiInCampo() {
  var cfg = S.partitaPendente;
  var sq = IE.squadraDi(cfg.avv);
  if (!sq) { G.vai('hub'); return; }
  aggiornaTitolari();
  var titolari, panchina, nomeMio = S.nomeSquadra, siglaMia = S.sigla, colMio = '#2f9e63';
  if (cfg.caravan) {
    var cv = rosaCaravan();
    titolari = cv.undici; panchina = cv.panchina;
    nomeMio = 'Raimon'; siglaMia = 'RAI'; colMio = '#e8703a';
  } else {
    titolari = S.titolari.map(function (id) { return clona(S.gioc(id)); }).filter(Boolean);
    panchina = S.rosa.filter(function (g) { return S.titolari.indexOf(g.id) < 0; }).map(clona);
    if (titolari.length < 11) {
      /* meno di undici: si gioca lo stesso, ma si sente */
      while (titolari.length < 11 && panchina.length) titolari.push(panchina.shift());
    }
  }
  var rosaAvv = sq._rosa || IE.rosaSquadra(sq);
  sq._rosa = rosaAvv;
  P = new IE.Partita({
    titolo: cfg.titolo || 'Partita',
    minutiTempo: cfg.minuti || 45,
    interazione: S.opz.interazione,
    mia: { nome: nomeMio, sigla: siglaMia, col: colMio, stemma: cfg.caravan ? '⚡' : S.stemma,
           rosa: titolari, panchina: panchina, formazione: cfg.caravan ? '4-3-3' : S.formazione,
           spirito: cfg.caravan ? 70 : S.spirito },
    avv: { nome: sq.nome, sigla: sq.sigla, col: sq.col, stemma: sq.stemma, rosa: rosaAvv.slice(0, 11).map(clona), panchina: rosaAvv.slice(11).map(clona), formazione: '4-4-2', spirito: 40 }
  });
  G.posPrec = null; G.logVisto = 0;
  P.esiti = { vinto: cfg.vinto, perso: cfg.perso, pari: cfg.pari };
  P.amichevole = !!cfg.amichevole;
  P.caravan = !!cfg.caravan;
  P.avvId = cfg.avv;
  S.vista = 'partita';
  G.statoP = P.avanza(null);
  salva(); render();
}

function vistaPartita() {

    if (P.mia.ordiniRimasti <= 0) b.classList.add('disab');

    schermo.appendChild(pan);

  schermo.appendChild(el('<p class="aiuto-tasti">Tastiera: <b>1</b>…<b>9</b> scegli · <b>invio</b> conferma · <b>esc</b> indietro</p>'));
  schermo = schermoVero;
}
/* ---------- posizioni dei ventidue ---------- */
var BASE_X = { PT: 7, DF: 25, CC: 47, AT: 67 };
function posizioniCampo() {
  var out = [];
  [[P.mia, true], [P.avv, false]].forEach(function (par) {
    var lato = par[0], mio = par[1];
    var haPalla = P.possesso === lato;
    /* chi attacca sale, chi difende si abbassa */
    var spinta = haPalla ? (P.zona - 2) * 13 : -((P.zona - 2) * 8);
    ['PT', 'DF', 'CC', 'AT'].forEach(function (r) {
      var linea = lato.rosa.filter(function (g) { return g.ruolo === r; });
      linea.forEach(function (g, i) {
        var x = BASE_X[r] + (r === 'PT' ? 0 : spinta);
        x = Math.max(4, Math.min(94, x));
        var y = linea.length <= 1 ? 50 : 15 + 70 * i / (linea.length - 1);
        if (!mio) y = Math.max(9, Math.min(91, y + 8));
        out.push({
          k: (mio ? 'a_' : 'b_') + g.id, g: g, mio: mio,
          x: mio ? x : 100 - x, y: y,
          col: mio ? (g.ruolo === 'PT' ? '#f2b32e' : '#3fd07a') : (g.ruolo === 'PT' ? '#e0e0e0' : lato.col)
        });
      });
    });
  });
  return out;
}
function disegnaCampo() {
  var pos = posizioniCampo();
  var prec = G.posPrec || {};
  var portatore = P.portatore, marcato = P.pendente ? P.pendente.dif : null;
  var finali = {}, palla = null;
  var punti = pos.map(function (p) {
    finali[p.k] = { x: p.x, y: p.y };
    var pr = prec[p.k] || { x: p.x, y: p.y };
    var cls = 'pedina' + (p.mio ? '' : ' avv') + (p.g.ruolo === 'PT' ? ' pt' : '') +
      (p.g === portatore ? ' palla' : '') + (marcato && p.g === marcato ? ' marca' : '');
    if (p.g === portatore) palla = p;
    return '<div class="' + cls + '" style="left:' + pr.x + '%;top:' + pr.y + '%;background:' + p.col + '"' +

/* ---------- fine partita ---------- */
function finePartita() {
  var esito = P.esito;
  var premio = esito === 'vittoria' ? 310 : esito === 'pareggio' ? 220 : 155;
  var righe = [];
  P.mia.rosa.concat(P.mia.panchina).forEach(function (c) {
    var g = c._orig; if (!g) return;
    if (P.caravan && g.id !== 'tu') return;   /* nel caravan gioca solo il capitano: gli altri non sono tuoi */
    var inCampo = P.mia.rosa.indexOf(c) >= 0;
    var e = Math.round((premio + (inCampo ? 130 : 60)) * (1 + P.mia.duelliVinti * 0.012));
    var r = daiExp(g, e);
    if (r.salito.length) righe.push(esc(g.nome) + ' → livello ' + g.lv);
    r.imparate.forEach(function (t) { righe.push('<b>' + esc(g.nome) + ' impara ' + esc(IE.tec(t).nome) + '</b>'); });
    if (inCampo) {
      var im = cresciAffiatamento(g, esito === 'vittoria' ? 6 : 4);
      im.forEach(function (t) { righe.push('<b>' + esc(g.nome) + ' impara ' + esc(IE.tec(t).nome) + '</b>'); });
    }
  });
  S.spirito = Math.min(100, S.spirito + (esito === 'vittoria' ? 4 : esito === 'pareggio' ? 2 : 1));
  S.storico.push({ avv: P.avv.nome, gol: P.mia.gol, sub: P.avv.gol, esito: esito });
  if (S.incontrate.indexOf(P.avv.nome) < 0) S.incontrate.push(P.avv.nome);

  /* dopo una partita si rifiata, e si è parlato abbastanza */
  if (!P.caravan) riposoCompleto();

  /* contatti: chi ti ha visto giocare risponde al telefono */
  var contatti = esito === 'vittoria' ? 3 : esito === 'pareggio' ? 2 : 1;
  S.scout = (S.scout || 0) + contatti;
  var battuta = false;
  if (esito === 'vittoria' && P.avvId && !P.caravan && S.battute.indexOf(P.avvId) < 0) { S.battute.push(P.avvId); battuta = true; }
  righe.push('Contatti +' + contatti + (battuta ? ' — la rosa della ' + esc(P.avv.nome) + ' è ora richiamabile.' : ''));
  G.fine = { esito: esito, righe: righe, battuta: battuta, mia: P.mia.gol, avv: P.avv.gol, nomeAvv: P.avv.nome,
    tiri: [P.mia.tiri, P.avv.tiri], duelli: [P.mia.duelliVinti, P.avv.duelliVinti], esiti: P.esiti, amichevole: P.amichevole };
  S.partitaPendente = null;
  S.vista = 'finepartita';
  salva(); render();
}

   CARAVAN DELLA RAIMON
   Finita la storia, si gioca da singolo giocatore dentro una
   squadra che non è la tua, contro le squadre di Alius Academy.
   ============================================================ */
var ALIUS = ['gemini', 'epsilon', 'diamond', 'prominence', 'genesis'];

/* ---------- la rosa della carovana, che cambia capitolo per capitolo ---------- */
function preparaCaravan() {
  if (!S.caravan) S.caravan = { rosa: IE.caravanBase.slice(), arrivati: [] };
  return S.caravan;
}
function arrivanoInCarovana(nGioco) {
  preparaCaravan();
  var nuovi = IE.caravanArrivi[nGioco] || [];
  nuovi.forEach(function (id) {
    if (S.caravan.rosa.indexOf(id) < 0) S.caravan.rosa.push(id);
    if (S.caravan.arrivati.indexOf(id) < 0) S.caravan.arrivati.push(id);
    /* chi rientra dall'infortunio smette di essere un infortunato */
    var f = S.caravan.feriti || [], k = f.indexOf(id);
    if (k >= 0) f.splice(k, 1);
  });
}
/* Chi si fa male non sale più in campo: nel gioco è la prima cosa
   che fa Alius Academy, e qui succede uguale. */
function feritiInCarovana(nGioco) {
  preparaCaravan();
  S.caravan.feriti = S.caravan.feriti || [];
  (IE.caravanFerite[nGioco] || []).forEach(function (id) {
    var k = S.caravan.rosa.indexOf(id);
    if (k >= 0) S.caravan.rosa.splice(k, 1);
    if (S.caravan.feriti.indexOf(id) < 0) S.caravan.feriti.push(id);
  });
}

/* Le tecniche che un ragazzo della carovana impara strada facendo. */
function insegnaAlCaravan(chi, tec) {
  preparaCaravan();
  S.caravan.tec = S.caravan.tec || {};
  var l = S.caravan.tec[chi] = S.caravan.tec[chi] || [];
  if (l.indexOf(tec) < 0) l.push(tec);
}

/* Atto secondo: le tecniche del capitano si azzerano. Quelle di prima
   restano scritte da qualche parte, perché ad Amanome torneranno utili. */
function azzeraTecniche() {
  var io = S.gioc('tu');
  if (!io) return;
  S.tecPrima = (io.tec || []).slice();
  var base = (IE.atto2 && IE.atto2.base[io.ruolo]) || ['tiro_dritto'];
  io.tec = base.slice();
  io.eq = null;
  equipaggiaAuto(io);
}

/* E poi se ne impara una per capitolo, come fanno tutti gli altri. */
function imparoAtto2(nGioco) {
  var io = S.gioc('tu');
  if (!io || !IE.atto2 || !IE.atto2.impara[nGioco]) return;
  var t = IE.atto2.impara[nGioco][io.ruolo];
  if (!t || io.tec.indexOf(t) >= 0) return;
  io.tec.push(t);
  S.imparate = S.imparate || [];
  S.imparate.push(t);
  if (!io.eq || io.eq.length < SLOT) { equipaggiaAuto(io); return; }
  /* se la nuova è più forte della più debole dello stesso tipo, entra lei */
  var nuova = IE.tec(t); if (!nuova) return;
  var peggio = null;
  io.eq.forEach(function (id) {
    var x = IE.tec(id);
    if (!x || x.tipo !== nuova.tipo) return;
    if (!peggio || x.pot < peggio.pot) peggio = x;
  });
  if (peggio && peggio.pot < nuova.pot) io.eq[io.eq.indexOf(peggio.id)] = t;
}

function giocatoreRaimon(id) {
  var r = IE.squadraDi('raimon');
  var rosa = r._rosa || IE.rosaSquadra(r);
  for (var i = 0; i < rosa.length; i++) if (rosa[i].id === 'raimon_' + id) return rosa[i];
  return null;
}
function squadraVersione() {
  var v = IE.versioni[S.versione] || IE.versioni.fuoco;
  return v.squadra;
}



/* undici si devono essere: chi manca lo mette la scuola */
function riserveRaimon(quanti) {
  var sq = IE.squadraDi('raimon'), fuori = [];
  var base = Math.max(12, (sq.base || 43) - 12);
  for (var i = 0; i < quanti; i++) {
    var m = IE.caravanRiserve[i % IE.caravanRiserve.length];
    var g = {
      id: 'riserva_' + i, nome: m.nome, corto: m.nome.split(' ')[1] || m.nome,
      ruolo: m.ruolo, el: m.el, col: '#b0785a', prof: m.ruolo === 'PT' ? 'portiere' : 'terzino',
      pot: 0, base: {}, allen: {}, lv: sq.lv, exp: 0, numero: 20 + i,
      tec: [{ PT: 'presa_sicura', DF: 'contrasto', CC: 'doppio_passo', AT: 'tiro_dritto' }[m.ruolo]]
    };
    IE.ordineStat.forEach(function (k) { g.base[k] = base; });
    if (m.ruolo !== 'PT') g.base.par = Math.round(base * 0.35);
    g.tp = IE.tpMax(g); g.fp = IE.fpMax(g);
    fuori.push(g);
  }
  return fuori;
}

function conTecCaravan(g) {
  var mappa = (S.caravan && S.caravan.tec) || {};
  var corto = String(g.id).replace(/^raimon_/, '');
  /* le combinazioni cercano i compagni per nome breve: Bufera del
     Viverna vuole «kevin» e «shawn», non «raimon_kevin». */
  g.baseId = corto;
  var extra = mappa[corto] || [];
  if (!extra.length) return g;
  extra.forEach(function (t) { if (g.tec.indexOf(t) < 0) g.tec.push(t); });
  g.eq = null;
  var ordine = { PT: ['parata', 'blocco', 'drib', 'tiro'], DF: ['blocco', 'drib', 'tiro', 'parata'],
                 CC: ['drib', 'blocco', 'tiro', 'parata'], AT: ['tiro', 'drib', 'blocco', 'parata'] }[g.ruolo];
  var pool = g.tec.map(IE.tec).filter(Boolean).filter(function (t) { return !t.soloDi || t.soloDi === corto; });
  pool.sort(function (a, b) {
    var pa = ordine.indexOf(a.tipo), pb = ordine.indexOf(b.tipo);
    if (pa !== pb) return pa - pb;
    return b.pot - a.pot;
  });
  g.eq = pool.slice(0, 4).map(function (t) { return t.id; });
  return g;
}

function rosaCaravan() {
  preparaCaravan();
  var disponibili = S.caravan.rosa.map(giocatoreRaimon).filter(Boolean);
  /* Se manca gente si riempie con le riserve della scuola, non con
     chi deve ancora arrivare: nel gioco Axel Blaze al primo capitolo
     non c'è, e non deve comparire perché siamo in otto. */
  if (disponibili.length < 11) disponibili = disponibili.concat(riserveRaimon(11 - disponibili.length));
  /* gli undici: il portiere, poi i migliori per ruolo */
  var ordine = { PT: 0, DF: 1, CC: 2, AT: 3 };
  var ord = disponibili.slice().sort(function (a, b) {
    if (ordine[a.ruolo] !== ordine[b.ruolo]) return ordine[a.ruolo] - ordine[b.ruolo];
    return IE.valutazione(b) - IE.valutazione(a);
  });
  /* la Raimon del secondo gioco gioca con il tridente: Axel, Shawn e te */
  var conta = { PT: 0, DF: 0, CC: 0, AT: 0 }, voluti = { PT: 1, DF: 4, CC: 3, AT: 3 };
  var scelti = [], resto = [];
  ord.forEach(function (g) {
    if (conta[g.ruolo] < voluti[g.ruolo]) { scelti.push(g); conta[g.ruolo]++; } else resto.push(g);
  });
  while (scelti.length < 11 && resto.length) {
    var r1 = resto.shift();
    if (r1.ruolo === 'PT' && conta.PT >= 1) continue;   /* un portiere basta */
    scelti.push(r1);
  }
  var undici = scelti.slice(0, 11).map(clona).map(conTecCaravan);
  var panchina = resto.concat(scelti.slice(11)).map(clona).map(conTecCaravan);
  var io = clona(S.gioc('tu'));
  /* qui non sei il capitano e il tuo numero ce l'ha già qualcuno */
  io.capitano = false;
  var presi = {};
  undici.concat(panchina).forEach(function (g) { presi[g.numero] = 1; });
  if (presi[io.numero]) { for (var n = 12; n < 40; n++) if (!presi[n]) { io.numero = n; break; } }
  /* entri al posto del compagno più debole del tuo ruolo */
  var stesso = undici.filter(function (g) { return g.ruolo === io.ruolo; });
  var pool = stesso.length ? stesso : undici;
  var fuori = pool.slice().sort(function (a, b) { return IE.valutazione(a) - IE.valutazione(b); })[0];
  undici[undici.indexOf(fuori)] = io;
  panchina.unshift(fuori);
  return { undici: undici, panchina: panchina, uscito: fuori };
}

function vistaCaravan() {
  var c = capitolo();
  var inViaggio = c.atto === 2 && !S.flag.viaggio_finito;
  preparaCaravan();
  var ver = IE.versioni[S.versione] || IE.versioni.fuoco;

  schermo.appendChild(el('<h2>🚐 Inazuma Caravan</h2>'));
  schermo.appendChild(el('<p class="picc tenue">Non sei il capitano e non è il tuo campo. Sei uno degli undici, ' +
    'in mezzo a gente che ha perso la scuola a settembre.</p>'));
  schermo.appendChild(el('<div class="pannello stretto"><div class="etichetta">La strada che hai scelto</div>' +
    '<div style="font-size:17px;font-weight:bold">' + ver.icona + ' ' + esc(ver.nome) + '</div>' +
    '<div class="picc tenue">' + esc(ver.desc) + '</div></div>'));

  var cv = rosaCaravan();
  var io = S.gioc('tu');
  var box = el('<div class="pannello"><div class="etichetta">Gli undici di oggi</div><div class="griglia-schede"></div></div>');
  var g11 = box.querySelector('.griglia-schede');
  cv.undici.forEach(function (g) {
    g11.appendChild(schedaGiocatore(g, g.id === 'tu' ? '<b>tu</b>' : 'Lv ' + g.lv, null));
  });
  if (cv.uscito) box.appendChild(el('<div class="picc fioco" style="margin-top:8px">Entri al posto di <b>' +
    esc(cv.uscito.nome) + '</b>, il ' + IE.ruoli[io.ruolo].nome.toLowerCase() +
    ' più debole fra quelli disponibili. Se cresci, la scelta cambia da sola.</div>'));
  schermo.appendChild(box);

  var arr = (S.caravan.arrivati || []);
  if (arr.length) {
    var ab = el('<div class="pannello stretto"><div class="etichetta">Arrivati strada facendo</div></div>');
    arr.forEach(function (id) {
      var pg = IE.personaggi[id];
      var cap = { shawn: 3, scotty: 4, axel: 8, hurley: 8 }[id];
      ab.appendChild(el('<div class="picc" style="margin-bottom:4px">· <b>' + esc(pg ? pg.nome : id) +
        '</b> <span class="fioco">— capitolo ' + cap + '</span></div>'));
    });
    schermo.appendChild(ab);
  }

  if (inViaggio) {
    schermo.appendChild(el('<div class="avviso picc">Le partite le decide la storia: quando è ora, il capitolo ti porta in campo.</div>'));
    schermo.appendChild(bt('◀ Torna', null, function () { G.vai('hub'); }, 'piatta'));
    return;
  }

  /* dopo il viaggio: si torna a giocarsele */
  S.alius = S.alius || [];
  var sfide = el('<div class="pannello"><div class="etichetta">Alius Academy</div></div>');
  ALIUS.forEach(function (id) {
    var sq = IE.squadre[id];
    if (!sq) return;
    var mia = (id === ver.squadra), altra = (id === ver.altra);
    var nota = sq.motto + '  ·  livello consigliato ' + (sq.lvCons || sq.lv) +
      (mia ? '  ·  la squadra della tua strada' : altra ? '  ·  la squadra dell\'altra versione' : '');
    sfide.appendChild(bt(sq.stemma + '  ' + sq.nome, nota, function () {
      avviaPartita({ avv: id, titolo: 'Caravan — Raimon vs ' + sq.nome, minuti: 45, amichevole: true, caravan: true });
    }));
  });
  schermo.appendChild(sfide);

  var sq2 = IE.squadre.chaos;
  var pronte = S.alius.indexOf('prominence') >= 0 && S.alius.indexOf('diamond') >= 0;
  var cb = el('<div class="pannello"><div class="etichetta">Collegare le due versioni</div></div>');
  cb.appendChild(el('<p class="picc tenue">Nei giochi <b>Chaos</b> — Prominence e Diamond Dust messe insieme — si vede solo ' +
    'mettendo in comunicazione le due cartucce, e solo dopo aver battuto la squadra di ciascuna versione. ' +
    'Qui funziona uguale.</p>'));
  cb.appendChild(el('<div class="picc" style="margin-bottom:8px">' +
    (S.alius.indexOf('prominence') >= 0 ? '✔' : '○') + ' Prominence &nbsp;&nbsp; ' +
    (S.alius.indexOf('diamond') >= 0 ? '✔' : '○') + ' Diamond Dust</div>'));
  var bc = bt(sq2.stemma + '  ' + sq2.nome, pronte ? sq2.motto : 'Battile tutte e due, poi torna qui.', function () {
    avviaPartita({ avv: 'chaos', titolo: 'Caravan — Raimon vs Chaos', minuti: 45, amichevole: true, caravan: true });
  }, pronte ? 'verde' : '');
  if (!pronte) bc.classList.add('disab');
  cb.appendChild(bc);
  schermo.appendChild(cb);

  schermo.appendChild(bt('◀ Torna', null, function () { G.vai('hub'); }, 'piatta'));
}

/* ============================================================
   OPZIONI
   ============================================================ */
function vistaOpzioni() {
  schermo.appendChild(el('<h2>Salvataggio e opzioni</h2>'));
  var box = el('<div class="pannello"><div class="etichetta">Quanto vuoi decidere in partita</div></div>');
  [['rapida', 'Rapida', 'Decidi solo in attacco e sui tiri in area.'],
   ['normale', 'Normale', 'Decidi in attacco e quando difendi vicino alla tua area.'],
   ['completa', 'Completa', 'Decidi ogni singolo duello, anche a centrocampo.']].forEach(function (o) {
    box.appendChild(bt(o[1], o[2], function () { S.opz.interazione = o[0]; salva(); render(); },
      S.opz.interazione === o[0] ? 'primario' : ''));
  });
  schermo.appendChild(box);

  var b2 = el('<div class="pannello"><div class="etichetta">Il salvataggio</div></div>');
  b2.appendChild(bt('⬇️  Esporta su file', 'Un file di testo da tenere da parte.', function () {
    var c = {}; for (var k in S) if (typeof S[k] !== 'function') c[k] = S[k];
    var t = JSON.stringify(c);
    var a = document.createElement('a');
    a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(t);
    a.download = 'amanome-' + (S.io ? S.io.nome.replace(/\W+/g, '') : 'salvataggio') + '.json';
    a.click();
  }));
  b2.appendChild(bt('⬆️  Importa da file', 'Sostituisce la partita in corso.', function () {
    var i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var s = JSON.parse(fr.result);
          if (!s.ver) throw 0;
          S = metodi(s); S.vista = 'hub'; salva(); render();
        } catch (e) { alert('File non valido.'); }
      };
      fr.readAsText(i.files[0]);
    };
    i.click();
  }));
  b2.appendChild(bt('🗑️  Cancella e ricomincia', null, function () {
    if (!confirm('Cancello tutto?')) return;
    localStorage.removeItem(CHIAVE); S = metodi(nuovoStato()); render();
  }, 'rossa'));
  schermo.appendChild(b2);
  schermo.appendChild(bt('📱  Installare sul telefono', 'Per averlo come app, anche senza rete.', function () { mostraInstalla(); }, 'piatta'));
  schermo.appendChild(bt('💻  Giocare da computer', 'Tastiera, schermo grande e file da portare via.', function () { mostraPC(); }, 'piatta'));
  schermo.appendChild(bt('Come si gioca', null, function () { mostraAiuto(); }, 'piatta'));
  schermo.appendChild(bt('◀ Torna', null, function () { G.vai('hub'); }, 'piatta'));
}

  try { localStorage.setItem('_prova', '1'); localStorage.removeItem('_prova'); return true; }
  catch (e) { return false; }

/* ============================================================
   AVVIO
   ============================================================ */
function avvio() {
  schermo = $('#schermo'); barra = $('#barra');
  try {
    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches && window.innerWidth >= 900) {
      document.body.classList.add('tastiera');
    }
  } catch (e) {}
  S = metodi(nuovoStato());
  render();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('./sw-ie.js').catch(function () {});
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', avvio);
else avvio();

})();
